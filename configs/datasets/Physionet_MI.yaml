dataset: Physionet_MI
root_path: ~/data/Physionet_MI_wsn
params:
  seq_len: 800
  model: eeg_basis_mixer_v2
  itr: 5
  seed_start: 42
  split_mode: segment_stratified_random
  train_ratio: 0.4
  val_ratio: 0.3
  select_metric: F1
  use_gpu: true
  gpu_idx:
  - 1
  gpu: 1
  num_workers: 8
  train_epochs: 40
  patience: 10
  batch_size: 64
  learning_rate: 0.0003
  lradj: cosine
  d_model: 192
  t_layer: 5
  v_layer: 0
  dropout: 0.15
  patch_len: 32
  patch_stride: 8
  augmentations: none
  channel_basis_dim: 32
  k_basis_dim: 16
  t_basis_dim: 20
  patch_embed_dim: 192
  channel_graph_sigma: 0.1
  channel_base_decay: 0.3
  use_channel_adapter: false
  canonical_channels: 59
  no_channel_prior: false
  channel_adapter_sigma: 0.1
  channel_adapter_hidden: 32
  channel_adapter_residual_scale: 0.05
  input_channel_coord_path: ./configs/electrodes/Physionet_MI.csv
  canonical_channel_coord_path: ./configs/electrodes/Physionet_MI.csv
electrode_csv: ./configs/electrodes/Physionet_MI.csv
electrode_montage_used: standard_1005
electrode_channel_count: 64
