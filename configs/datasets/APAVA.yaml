dataset: APAVA
root_path: /work/bme-shenxk/data/APAVA
params:
  model: eeg_mixer_v11_2_no_stem
  itr: 1
  seed_start: 5
  split_mode: stratified_random
  train_ratio: 0.8
  val_ratio: 0.1
