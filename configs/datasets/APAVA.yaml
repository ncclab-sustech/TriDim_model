dataset: APAVA
root_path: /work/bme-shenxk/data/APAVA
params:
  model: eeg_mixer_v3_tconv
  itr: 5
  seed_start: 42
  split_mode: label_order
  train_ratio: 0.4
  val_ratio: 0.3
  select_metric: F1
  use_gpu: true
  gpu_idx:
  - 0
  gpu: 0
  num_workers: 8
  train_epochs: 100
  patience: 20
  batch_size: 128
  learning_rate: 0.002
  lradj: cosine
  n_heads: 4
  t_layer: 4
  v_layer: 0
  dropout: 0.1
  patch_len: 80
  patch_stride: 20
  augmentations: none
  channel_basis_dim: 32
  k_basis_dim: 16
  t_basis_dim: 16
  patch_embed_dim: 128
  use_channel_adapter: false
  canonical_channels: 16
  no_channel_prior: false
  use_subject_label_for_split: true
