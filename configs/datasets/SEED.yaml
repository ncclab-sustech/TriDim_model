dataset: SEED
root_path: /work/bme-shenxk/data/SEED
electrode_channel_count: 62
electrode_csv: ./configs/electrodes/SEED_V.csv
electrode_montage_used: standard_1020
params:
  model: eeg_mixer_v11_2_no_stem
  patch_len: 40
  patch_stride: 10
  channel_basis_dim: 96
  k_basis_dim: 32
  t_basis_dim: 32
  patch_embed_dim: 256
  n_heads: 4
  t_layer: 6
  dropout: 0.2
  layer_scale_init: 0.01
  use_input_norm: true
  stem_kernels:
  - 51
  - 99
  - 199
  stem_hidden_mult: 4
  stem_dropout: 0.1
  drop_path_c: 0.25
  drop_path_k: 0.05
  drop_path_t: 0.15
  drop_path_mlp: 0.05
  drop_path_schedule: linear
  use_channel_adapter: true
  canonical_channels: 62
  channel_adapter_sigma: 0.35
  channel_adapter_hidden: 32
  channel_adapter_residual_scale: 0.1
  canonical_channel_coord_path: ./configs/electrodes/SEED_V.csv
  input_channel_coord_path: ./configs/electrodes/SEED_V.csv
  no_channel_prior: false
  use_multi_level_readout: true
  augmentations: none
  batch_size: 32
  learning_rate: 0.0003
  lradj: cosine
  optimizer: AdamW
  weight_decay: 0.02
  train_epochs: 100
  patience: 20
  num_workers: 4
  select_metric: F1
  split_mode: label_order
  train_ratio: 0.4
  val_ratio: 0.3
  use_gpu: true
  gpu: 0
  gpu_idx:
  - 0
  itr: 5
  seed_start: 5
  use_cosine_scheduler: true
  warmup_epochs: 5
  label_smoothing: 0.1
  gradient_clip_norm: 1.0
  eta_min: 1.0e-06
  use_subject_label_for_split: false
  seed: 5
