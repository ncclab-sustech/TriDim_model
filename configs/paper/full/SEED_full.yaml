dataset: SEED
root_path: ${TRIDIM_DATA_ROOT}/SEED
electrode_channel_count: 62
electrode_csv: ./configs/electrodes/SEED_V.csv
electrode_montage_used: standard_1020
params:
  model: eeg_mixer_v11_1_spatial_multilevel
  patch_len: 80
  patch_stride: 80
  channel_basis_dim: 96
  k_basis_dim: 32
  t_basis_dim: 32
  patch_embed_dim: 128
  n_heads: 4
  t_layer: 3
  dropout: 0.15
  layer_scale_init: 0.01
  use_input_norm: true
  stem_kernels:
  - 51
  - 99
  - 199
  stem_hidden_mult: 4
  stem_dropout: 0.05
  drop_path_c: 0.1
  drop_path_k: 0.02
  drop_path_t: 0.08
  drop_path_mlp: 0.02
  drop_path_schedule: constant
  canonical_channels: 62
  canonical_channel_coord_path: ./configs/electrodes/SEED_V.csv
  input_channel_coord_path: ./configs/electrodes/SEED_V.csv
  no_channel_prior: false
  use_multi_level_readout: true
  batch_size: 32
  learning_rate: 0.0005
  lradj: cosine
  optimizer: AdamW
  weight_decay: 0.01
  train_epochs: 100
  patience: 20
  num_workers: 4
  select_metric: Accuracy
  split_mode: stratified_random
  train_ratio: 0.8
  val_ratio: 0.1
  use_gpu: true
  gpu: 0
  gpu_idx:
  - 0
  itr: 3
  seeds: [5, 42, 43]
  seed_start: 5
  use_cosine_scheduler: true
  warmup_epochs: 5
  label_smoothing: 0.05
  gradient_clip_norm: 1.0
  eta_min: 1.0e-06
  seed: 42
