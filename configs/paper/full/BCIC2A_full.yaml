dataset: BCIC2A
root_path: ${TRIDIM_DATA_ROOT}/BCIC2A_wsn
electrode_channel_count: 22
electrode_csv: ./configs/electrodes/BCIC2A.csv
electrode_montage_used: standard_1020
params:
  model: tridim
  itr: 3
  seeds: [5, 42, 43]
  seed: 5
  seed_start: 5
  split_mode: stratified_random
  train_ratio: 0.8
  val_ratio: 0.1
  select_metric: Accuracy
  use_gpu: true
  gpu: 0
  gpu_idx:
  - 0
  num_workers: 4
  train_epochs: 100
  patience: 20
  batch_size: 16
  learning_rate: 0.0005
  lradj: cosine
  optimizer: AdamW
  weight_decay: 0.01
  use_cosine_scheduler: true
  warmup_epochs: 5
  label_smoothing: 0.025
  gradient_clip_norm: 1.0
  eta_min: 1.0e-06
  patch_len: 40
  patch_stride: 10
  channel_basis_dim: 96
  k_basis_dim: 32
  t_basis_dim: 32
  patch_embed_dim: 128
  t_layer: 3
  n_heads: 4
  dropout: 0.1
  stem_dropout: 0.1
  stem_hidden_mult: 4
  stem_kernels:
  - 51
  - 99
  - 199
  layer_scale_init: 0.01
  drop_path_c: 0.1
  drop_path_k: 0.02
  drop_path_t: 0.08
  drop_path_mlp: 0.02
  drop_path_schedule: constant
  use_input_norm: true
  canonical_channels: 22
  canonical_channel_coord_path: ./configs/electrodes/BCIC2A.csv
  input_channel_coord_path: ./configs/electrodes/BCIC2A.csv
  no_channel_prior: false
  use_subject_label_for_split: false
  use_multi_level_readout: true
