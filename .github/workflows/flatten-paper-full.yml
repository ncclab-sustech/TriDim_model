name: Flatten paper Full repository
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: flatten-paper-full-once
  cancel-in-progress: false
jobs:
  flatten:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare and verify exact migration scope
        run: python .github/workflows/apply_paper_full.py prepare
      - name: Install CPU validation dependencies
        run: |
          python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r "$RUNNER_TEMP/tridim-flat-full-validated/requirements-runtime.txt"
      - name: Validate Full imports, gradients, logs and 24-job grid
        run: |
          cd "$RUNNER_TEMP/tridim-flat-full-validated"
          python scripts/verify_reported_results.py
          python scripts/smoke_test_models.py
          python -c "import run; from exp.exp_basic import Exp_Basic; assert tuple(Exp_Basic.MODEL_REGISTRY) == run.PAPER_MODELS == ('eeg_mixer_v11_1_spatial_multilevel',); print('Full-only imports verified')"
          python scripts/run_full_paper.py --gpus 0 1 2 3 --dry-run > "$RUNNER_TEMP/full-grid.jsonl"
          python -c "import json,os,pathlib; rows=[json.loads(s) for s in (pathlib.Path(os.environ['RUNNER_TEMP'])/'full-grid.jsonl').read_text().splitlines()]; assert len(rows)==len({(r['dataset'],r['seed']) for r in rows})==24; print('24 distinct jobs verified')"
      - name: Commit verified root tree without force
        run: python .github/workflows/apply_paper_full.py commit
