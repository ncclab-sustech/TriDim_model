name: Validate and publish TriDim naming
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rename-tridim-once
  cancel-in-progress: false
jobs:
  validate-and-rename:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare scoped rename and verify archived results
        run: python .github/workflows/rename_model.py prepare
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r "$RUNNER_TEMP/tridim-rename-check/pretraining/requirements.txt"
      - name: Check Full model, imports and all 24 launch commands
        working-directory: ${{ runner.temp }}/tridim-rename-check
        run: |
          python scripts/smoke_test_models.py
          python run.py --help
          python -c "from exp.exp_basic import Exp_Basic; assert list(Exp_Basic.MODEL_REGISTRY)==['tridim']"
          python scripts/run_full_paper.py --gpus 0 1 2 3 --dry-run
      - name: Prepare pinned upstream sources
        run: python "$RUNNER_TEMP/tridim-rename-check/pretraining/prepare_upstreams.py"
      - name: Check all three pretraining integrations
        run: python "$RUNNER_TEMP/tridim-rename-check/pretraining/smoke_test.py"
      - name: Publish verified rename
        run: python .github/workflows/rename_model.py commit
