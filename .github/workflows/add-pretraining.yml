name: Add validated TriDim pretraining
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: add-tridim-pretraining-once
  cancel-in-progress: false
jobs:
  validate-and-add:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare additions and verify preserved Full result
        run: python .github/workflows/add_pretraining.py prepare
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r "$RUNNER_TEMP/tridim-pretraining-check/pretraining/requirements.txt"
      - name: Obtain pinned upstream revisions
        run: python "$RUNNER_TEMP/tridim-pretraining-check/pretraining/prepare_upstreams.py"
      - name: Check three pretraining interfaces and reconstruction gradients
        run: python "$RUNNER_TEMP/tridim-pretraining-check/pretraining/smoke_test.py"
      - name: Publish additions without altering existing code or README
        run: python .github/workflows/add_pretraining.py commit
