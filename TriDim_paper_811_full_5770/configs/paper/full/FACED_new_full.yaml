dataset: FACED_new
root_path: ${TRIDIM_DATA_ROOT}/FACED_new
enc_in: 32
electrode_channel_count: 32
electrode_csv: ./configs/electrodes/FACED_new.csv
electrode_montage_used: standard_1020
params:
  model: eeg_mixer_v11_1_spatial_multilevel
  seq_len: 2000
  num_class: 9
  n_heads: 4
  layer_scale_init: 0.01
  use_input_norm: true
  canonical_channels: 32
  canonical_channel_coord_path: ./configs/electrodes/FACED_new.csv
  input_channel_coord_path: ./configs/electrodes/FACED_new.csv
  no_channel_prior: false
  use_multi_level_readout: true
  patience: 20
  num_workers: 4
  select_metric: Accuracy
  split_mode: stratified_random
  train_ratio: 0.8
  val_ratio: 0.1
  use_gpu: true
  gpu: 0
  gpu_idx:
  - 0
  itr: 3
  seeds: [5, 42, 43]
  seed_start: 5
  train_epochs: 100
  use_cosine_scheduler: true
  warmup_epochs: 5
  label_smoothing: 0.05
  gradient_clip_norm: 1.0
  eta_min: 1e-06
  lradj: cosine
  optimizer: AdamW
  weight_decay: 0.0
  batch_size: 32
  patch_len: 80
  patch_stride: 20
  channel_basis_dim: 96
  k_basis_dim: 32
  t_basis_dim: 32
  patch_embed_dim: 256
  t_layer: 6
  dropout: 0.15
  learning_rate: 0.0005
  drop_path_c: 0.1
  drop_path_k: 0.02
  drop_path_t: 0.08
  drop_path_mlp: 0.02
  drop_path_schedule: constant
  stem_dropout: 0.05
  seed: 42
